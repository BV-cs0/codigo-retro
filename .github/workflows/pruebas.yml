name: Pruebas

# Pasa las pruebas del juego y las del aviso de versión del .exe en cada cambio.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas del juego
        run: node pruebas/ejecutar.js

      - name: Pruebas del aviso de versión del .exe
        run: node --test escritorio/pruebas/actualizador.test.js
