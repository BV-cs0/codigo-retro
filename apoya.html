<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="apoya.apoya_al_creador_codigo_retro">Apoya al creador — Código Retro</title>
  <link rel="stylesheet" href="css/estilo.css?v=1.3.0">
  <link rel="stylesheet" href="css/taller.css?v=1.3.0">
</head>
<body>
  <header class="barra"><h1 data-t="apoya.apoya_al_creador">Apoya al creador</h1><a class="boton" href="index.html" data-t="apoya.menu_principal">← Menú principal</a>    <div class="selector-idioma" role="group" aria-label="Idioma" data-t-aria="idioma.selector">
      <button type="button" data-idioma="es" aria-pressed="true" aria-label="Español" data-t-aria="idioma.es">ES</button>
      <span aria-hidden="true">|</span>
      <button type="button" data-idioma="en" aria-pressed="false" aria-label="Inglés" data-t-aria="idioma.en">EN</button>
    </div>
  </header>
  <main class="contenedor pagina-creador">
    <p data-t="apoya.codigo_retro_es_gratis_y_sin">Código Retro es gratis y sin anuncios. Si te ayuda, puedes apoyar al creador.</p>
    <div class="formas-apoyo" id="formas-apoyo"></div>
    <section class="panel">
      <h2 data-t="apoya.tambien_puedes_ayudar_gratis">También puedes ayudar gratis</h2>
      <ul id="apoyo-gratis" class="apoyo-gratis"></ul>
      <input id="enlace-pagina" aria-label="Enlace de la página" data-t-aria="apoya.enlace_de_la_pagina" readonly hidden>
      <p id="estado-compartir" role="status"></p>
    </section>
  </main>
  <script src="js/idiomas/es.js?v=1.3.0"></script>
  <script src="js/idiomas/en.js?v=1.3.0"></script>
  <script src="js/comun/idioma.js?v=1.3.0"></script>
  <script src="js/datos-apoyo.js?v=1.3.0"></script>
  <script src="js/paginas-creador.js?v=1.3.0"></script>
</body>
</html>
